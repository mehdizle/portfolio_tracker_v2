name: Dependabot auto-merge

# Hands-off dependency updates: when Dependabot opens a PR, enable GitHub's
# "auto-merge" so the PR merges ITSELF once all required checks pass (the CI
# workflow in ci.yml: test + build). Nothing merges while tests are red.
#
# SAFETY: auto-merge covers:
#   - patch & minor bumps for ANY ecosystem (npm + github-actions)
#   - MAJOR bumps for GITHUB-ACTIONS only (e.g. dependabot/fetch-metadata 2->3,
#     actions/checkout 7->8). Action majors are low-risk here: they're small,
#     CI exercises them directly on the PR, and a bad one just fails a workflow
#     run rather than shipping broken app code.
# MAJOR bumps for npm (e.g. a future Vite 9 / Vitest 6) are STILL left for
# manual review, because an npm major can carry breaking changes to the build
# that a green test suite won't necessarily catch.
#
# NOTE: this fires on Dependabot's PRs only. GitHub runs Dependabot events with a
# read-only token by default, so we grant the minimal write scopes here.

on: pull_request_target

permissions:
  contents: write # needed to enable auto-merge / merge the PR
  pull-requests: write # needed to approve + comment on the PR

jobs:
  auto-merge:
    runs-on: ubuntu-24.04
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      - name: Enable auto-merge for patch & minor updates (any ecosystem)
        if: >-
          ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' ||
              steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for GitHub Actions MAJOR updates
        # Actions majors are low-risk (small, CI-exercised, no app-code blast
        # radius), so merge them automatically too - but ONLY for the
        # github-actions ecosystem, never npm.
        if: >-
          ${{ steps.meta.outputs.update-type == 'version-update:semver-major' &&
              steps.meta.outputs.package-ecosystem == 'github_actions' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Leave a note on npm MAJOR updates (manual review)
        # npm majors still require a human: a green test suite can miss a
        # breaking build/runtime change in a major Vite/Vitest bump.
        if: >-
          ${{ steps.meta.outputs.update-type == 'version-update:semver-major' &&
              steps.meta.outputs.package-ecosystem != 'github_actions' }}
        run: |
          gh pr comment "$PR_URL" --body \
            "This is a **major** npm version bump (${{ steps.meta.outputs.dependency-names }}). Auto-merge is intentionally disabled for npm majors - please review the changelog and merge manually once CI is green."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

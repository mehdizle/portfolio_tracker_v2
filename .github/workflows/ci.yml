name: CI (test + build)

# Verification-only CI for pull requests (and manual runs). This does NOT deploy
# - it just proves the test suite and the production build pass on the PR branch.
# It's what makes Dependabot auto-merge safe: a dependency bump can only merge
# after this is green. deploy.yml still owns the real build+deploy on push to main.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # setup-node v7's `package-manager-cache` input defaults to TRUE
          # regardless of the old `cache:` input, and still requires a
          # committed lockfile ("Dependencies lock file is not found" if
          # missing). Disable it explicitly. See deploy.yml for the same note.
          package-manager-cache: false

      - name: Install dependencies
        run: |
          # Same self-healing install as deploy.yml: prefer strict npm ci; on a
          # missing/out-of-sync lockfile, regenerate it FROM SCRATCH (delete +
          # npm install). Deleting first avoids npm's "Cannot read properties of
          # null (reading 'edgesOut')" crash that happens when npm install runs
          # over a stale lock it can't reconcile.
          if [ -f package-lock.json ]; then
            npm ci || {
              echo "npm ci failed (lockfile out of sync) - regenerating lockfile from scratch";
              rm -f package-lock.json;
              npm install;
            }
          else
            npm install
          fi

      - name: Run tests (financial core)
        run: npm test

      - name: Build (concat UI + Vite bundle/minify)
        run: npm run build

name: CI (test + build)

# Verification-only CI for pull requests (and manual runs). This does NOT deploy
# - it just proves the test suite and the production build pass on the PR branch.
# It's what makes Dependabot auto-merge safe: a dependency bump can only merge
# after this is green. deploy.yml still owns the real build+deploy on push to main.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # setup-node v7's `package-manager-cache` input defaults to TRUE
          # regardless of the old `cache:` input, and still requires a
          # committed lockfile ("Dependencies lock file is not found" if
          # missing). Disable it explicitly. See deploy.yml for the same note.
          package-manager-cache: false

      - name: Install dependencies
        run: |
          # --legacy-peer-deps works around a known npm/arborist bug
          # (https://github.com/npm/cli/issues/8261) that crashes with "Cannot
          # read properties of null (reading 'edgesOut')" while resolving
          # Vite 8.3.0's many OPTIONAL peerDependencies - even on a fresh
          # install with no lockfile. None of those optional peers are used
          # here, so skipping strict peer resolution is safe. See deploy.yml
          # for the full note.
          npm install --legacy-peer-deps

      - name: Run tests (financial core)
        run: npm test

      - name: Build (concat UI + Vite bundle/minify)
        run: npm run build

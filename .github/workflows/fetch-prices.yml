name: Fetch latest prices (TradingView)

# Pulls the latest Casablanca prices + fundamentals from TradingView's public
# scanner endpoint (scripts/fetch-prices.mjs) and commits public/prices.json.
# The app's "Fetch latest" button then loads that file; manual paste stays as
# the fallback. Committing prices.json to main triggers deploy.yml, which
# republishes the site with the fresh file served under /logos-style public/.
#
# Runs on a weekday-evening schedule (after CSE close, Africa/Casablanca) and
# can be run on demand from the Actions tab (workflow_dispatch).

on:
  schedule:
    # Mon-Fri. The CSE closes ~16:30 local (Africa/Casablanca), so this leaves
    # time for TradingView's end-of-day data to settle.
    #
    # NOTE on timing: GitHub cron is best-effort - top-of-the-hour schedules
    # (":00") queue behind everyone else's and can be delayed hours or skipped.
    # So we (1) use an ODD MINUTE (:17), which is picked up sooner than :00, and
    # (2) add a SECOND, later run as a backup. A duplicate run is harmless: the
    # `concurrency` group serializes them and the commit step only writes when
    # the data actually changed, so at most one no-op extra run per day.
    - cron: "17 18 * * 1-5" # 18:17 UTC - primary, off-peak minute
    - cron: "17 20 * * 1-5" # 20:17 UTC - backup if the primary was delayed/skipped
  workflow_dispatch: {}

permissions:
  contents: write # commit prices.json
  actions: write # dispatch deploy.yml after committing

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch prices -> public/prices.json
        run: node scripts/fetch-prices.mjs

      - name: Commit prices.json + price-history.json + trigger deploy (only if changed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Two files can change per run: prices.json (latest snapshot, only when
          # stock prices moved) and price-history.json (one NEW daily row every
          # run, even when prices are unchanged - a new date is a new curve
          # point). Gate on BOTH so a fresh history row is never dropped just
          # because prices happened to be flat that day.
          if [ -n "$(git status --porcelain public/prices.json public/price-history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/prices.json public/price-history.json
            git commit -m "chore: refresh prices.json + price-history.json (TradingView)"
            git push
            # A commit made with GITHUB_TOKEN does NOT trigger other workflows'
            # `push` events (GitHub's anti-recursion safeguard). So the deploy
            # would never run and the new files would never reach Pages.
            # Explicitly dispatch deploy.yml so the site rebuilds with them.
            gh workflow run deploy.yml --ref main
          else
            echo "prices.json + price-history.json unchanged - nothing to commit / deploy"
          fi

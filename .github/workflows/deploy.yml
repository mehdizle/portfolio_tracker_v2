name: Test, build and deploy to GitHub Pages

# On push to main: run tests -> build -> deploy. The build/deploy only happens
# if tests pass, so a financial-core regression cannot reach production.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # setup-node v7 added a NEW input, `package-manager-cache`, that
          # defaults to true REGARDLESS of whether the old `cache:` input is
          # set. When true it still requires a committed lockfile (same
          # "Dependencies lock file is not found" crash we were trying to
          # avoid by just omitting `cache: npm`). Explicitly disable it - this
          # repo's install is small/fast enough that caching isn't worth
          # fighting the lockfile-must-already-exist requirement.
          package-manager-cache: false

      - name: Install dependencies
        run: |
          # Vite 8.3.0 declares a dozen OPTIONAL peerDependencies (sass, less,
          # terser, @vitejs/devtools, etc. - none of which this project uses).
          # Current npm (arborist) has a known bug resolving peer sets for
          # graphs like this: it crashes with "Cannot read properties of null
          # (reading 'edgesOut')" inside #loadPeerSet, even on a completely
          # fresh `npm install` with NO lockfile at all (confirmed - this is
          # not a stale-lockfile issue). See https://github.com/npm/cli/issues/8261.
          #
          # --legacy-peer-deps makes npm skip that modern peer-resolution path
          # entirely (pre-npm-7 behavior). Since none of Vite's optional peers
          # are declared here, there's nothing to conflict on, so this is safe.
          # Using plain `npm install` (not `npm ci`) since there's no committed
          # lockfile right now; this also regenerates one every run, which the
          # next step commits back.
          npm install --legacy-peer-deps

      - name: Commit refreshed lockfile (if changed)
        continue-on-error: true
        run: |
          # NOTE: `main` is a PROTECTED branch (required status check: verify).
          # That means the github-actions bot CANNOT push a commit straight to
          # main - required checks haven't run on such a commit, so GitHub
          # rejects it. The old auto-push-back therefore always failed under
          # protection and only produced noise. We no longer try to push here.
          #
          # The committed package-lock.json is kept current the proper way now:
          # Dependabot opens npm update PRs (which run `verify` and merge via the
          # normal gated flow), and a human can refresh it with a local
          # `npm install` + PR after changing devDependencies. CI itself never
          # depends on the committed lockfile being fresh - the install step
          # regenerates it each run via `npm install --legacy-peer-deps`.
          #
          # We still REPORT drift so it's visible when package.json has changed
          # but the committed lockfile hasn't caught up yet.
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            echo "::notice title=Lockfile drift::The committed package-lock.json differs from a fresh install (package.json likely changed). Refresh it via a local 'npm install' + PR, or let Dependabot update it. CI is unaffected."
            echo "- lockfile: DRIFTED from package.json - refresh via PR (CI still OK; Dependabot/local npm install)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- lockfile: in sync with package.json" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify lockfile state (Dependabot needs a committed lockfile)
        run: |
          # Make the lockfile state loud and visible in the run summary. A MISSING
          # package-lock.json is exactly what makes Dependabot's npm updater fail
          # ("The updater encountered one or more errors"), so surface it clearly
          # instead of letting it fail silently off-screen.
          #
          # Note: on the very first run that CREATES the lockfile, the commit in
          # the previous step pushed it to the repo, but THIS checkout's working
          # tree already has the file too - so `-f package-lock.json` is true here
          # even on run #1. If it's somehow still absent, warn (don't hard-fail:
          # the build can still proceed via npm install; it's Dependabot that
          # cares). Set FAIL_IF_NO_LOCKFILE=1 later to turn this into a hard gate.
          if [ -f package-lock.json ]; then
            PKGS=$(grep -c '"resolved"' package-lock.json || echo "?")
            echo "lockfile OK (resolved entries: $PKGS)"
            echo "- lockfile: present (resolved entries: $PKGS) - Dependabot npm updates will work" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=No package-lock.json::Lockfile is missing. Dependabot's npm updater will error until a committed lockfile exists. The self-healing install step should have created it - check the 'Commit refreshed lockfile' step's push for failures (e.g. branch protection blocking the bot push)."
            echo "- lockfile: MISSING - Dependabot npm updates will keep failing until this is committed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run tests (financial core)
        run: npm test

      - name: Build (concat UI + Vite bundle/minify)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: Test, build and deploy to GitHub Pages

# On push to main: run tests -> build -> deploy. The build/deploy only happens
# if tests pass, so a financial-core regression cannot reach production.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # setup-node's npm cache tolerates a missing lockfile (it just skips
          # caching on the first run), so we can always enable it.
          cache: npm

      - name: Install dependencies (self-healing lockfile)
        run: |
          # Prefer the fast, strict `npm ci`. But `npm ci` FAILS by design when
          # package.json and package-lock.json disagree (e.g. after a manual
          # version bump like vitest 4 -> 5). In that case - or when no lockfile
          # exists yet - fall back to `npm install`, which regenerates the lock
          # to match package.json. This makes dependency bumps self-heal instead
          # of hard-failing the build.
          if [ -f package-lock.json ]; then
            npm ci || {
              echo "npm ci failed (lockfile out of sync) - regenerating with npm install";
              npm install;
            }
          else
            npm install
          fi

      - name: Commit refreshed lockfile (if changed)
        continue-on-error: true
        run: |
          # If install created or updated package-lock.json, commit it back so
          # the next run's `npm ci` is in sync again.
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: update package-lock.json to match package.json" || echo "nothing to commit"
            git push || echo "push skipped"
          else
            echo "lockfile unchanged - nothing to commit"
          fi

      - name: Run tests (financial core)
        run: npm test

      - name: Build (concat UI + Vite bundle/minify)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

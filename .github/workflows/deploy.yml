name: Test, build and deploy to GitHub Pages

# On push to main: run tests -> build -> deploy. The build/deploy only happens
# if tests pass, so a financial-core regression cannot reach production.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Keep the token wired into the local git config and check out the
          # branch (not a detached HEAD) so the "Commit refreshed lockfile" step
          # can push back to main. Without this, the bot commit can silently
          # fail to push and the lockfile never lands - which is what makes
          # Dependabot's npm updater keep erroring.
          persist-credentials: true
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          # NOTE: deliberately NOT using `cache: npm` here. That option hard-
          # requires a committed lockfile matching its glob (package-lock.json/
          # npm-shrinkwrap.json/yarn.lock) to exist BEFORE this step runs, and
          # fails the job immediately ("Dependencies lock file is not found")
          # if none does - which happens on the very run that's regenerating a
          # deleted/corrupt lockfile. Since this repo's install is small/fast,
          # skip npm's built-in cache rather than fight that chicken-and-egg
          # requirement.

      - name: Install dependencies (self-healing lockfile)
        run: |
          # Prefer the fast, strict `npm ci`. But `npm ci` FAILS by design when
          # package.json and package-lock.json disagree (e.g. after a manual
          # version bump, or an added `overrides` block). In that case fall back
          # to a FRESH install.
          #
          # IMPORTANT: when the fallback runs we DELETE the lockfile first and
          # let `npm install` rebuild it from scratch. Running `npm install`
          # *over* a stale/out-of-sync lock can crash npm's resolver with
          # "Cannot read properties of null (reading 'edgesOut')" (it can't
          # reconcile the old graph with new constraints). A clean regenerate
          # avoids that and always produces a valid lockfile matching
          # package.json. The "Commit refreshed lockfile" step then persists it
          # so the next run's fast `npm ci` path is back in sync.
          if [ -f package-lock.json ]; then
            npm ci || {
              echo "npm ci failed (lockfile out of sync) - regenerating lockfile from scratch";
              rm -f package-lock.json;
              npm install;
            }
          else
            npm install
          fi

      - name: Commit refreshed lockfile (if changed)
        continue-on-error: true
        run: |
          # If install created or updated package-lock.json, commit it back so
          # the next run's `npm ci` is in sync again.
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: update package-lock.json to match package.json" || echo "nothing to commit"
            # Push explicitly to the current branch. If this FAILS (e.g. branch
            # protection blocks the bot), surface it loudly in the run summary so
            # it's obvious why Dependabot's npm updater is still erroring - rather
            # than hiding behind a silent "push skipped".
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "- lockfile: committed + pushed to ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=Lockfile push failed::Could not push the regenerated package-lock.json to ${GITHUB_REF_NAME}. This is usually branch protection blocking the github-actions bot. Allow the bot to bypass protection, or commit a lockfile manually, or Dependabot's npm updater will keep failing."
              echo "- lockfile: regenerated but PUSH FAILED (branch protection?) - Dependabot npm updates will keep failing" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "lockfile unchanged - nothing to commit"
          fi

      - name: Verify lockfile state (Dependabot needs a committed lockfile)
        run: |
          # Make the lockfile state loud and visible in the run summary. A MISSING
          # package-lock.json is exactly what makes Dependabot's npm updater fail
          # ("The updater encountered one or more errors"), so surface it clearly
          # instead of letting it fail silently off-screen.
          #
          # Note: on the very first run that CREATES the lockfile, the commit in
          # the previous step pushed it to the repo, but THIS checkout's working
          # tree already has the file too - so `-f package-lock.json` is true here
          # even on run #1. If it's somehow still absent, warn (don't hard-fail:
          # the build can still proceed via npm install; it's Dependabot that
          # cares). Set FAIL_IF_NO_LOCKFILE=1 later to turn this into a hard gate.
          if [ -f package-lock.json ]; then
            PKGS=$(grep -c '"resolved"' package-lock.json || echo "?")
            echo "lockfile OK (resolved entries: $PKGS)"
            echo "- lockfile: present (resolved entries: $PKGS) - Dependabot npm updates will work" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=No package-lock.json::Lockfile is missing. Dependabot's npm updater will error until a committed lockfile exists. The self-healing install step should have created it - check the 'Commit refreshed lockfile' step's push for failures (e.g. branch protection blocking the bot push)."
            echo "- lockfile: MISSING - Dependabot npm updates will keep failing until this is committed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run tests (financial core)
        run: npm test

      - name: Build (concat UI + Vite bundle/minify)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
